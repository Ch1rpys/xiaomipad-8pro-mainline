# SPDX-License-Identifier: MIT
# Compressed swap in RAM, for Ubuntu's systemd-zram-generator, whose
# /usr/lib/systemd/zram-generator.conf already enables zram0: half the
# memory but at most 8 GiB, zstd, priority 100.  This file does nothing
# without that package.  The package belongs only on a root whose kernel has
# CONFIG_ZRAM (7.2.6-piano7 and later): without the module the generator still
# orders swap.target after /dev/zram0, and the boot waits for its timeout.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
