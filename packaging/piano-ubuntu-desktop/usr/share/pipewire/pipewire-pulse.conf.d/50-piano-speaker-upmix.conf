# The built-in speaker sink has four channels, FL FR RL RR (top pair, bottom
# pair; device/audio/ucm2).  PipeWire up-mixes in the stream's converter,
# which WirePlumber gives the sink's channel layout, so the method is a stream
# property, not one of the sink.  The converter's default method is "none":
# a stereo stream reaches the top pair only.  "simple" also feeds the bottom
# pair from the front channels (at -3 dB); it changes nothing for a stream
# that already has the channels of its sink, and on piano no other sink has
# more than two.  Installed for PulseAudio clients (pipewire-pulse.conf.d)
# and native clients (client.conf.d); a file of the same name in
# /etc/pipewire or ~/.config/pipewire overrides it.
stream.properties = {
    channelmix.upmix-method = simple
}
