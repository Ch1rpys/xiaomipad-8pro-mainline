# piano's PMIC RTC cannot be set (TD-022): every boot starts at the time
# fake-hwclock saved last (at shutdown or hourly), or at systemd's built-in
# epoch, which can be earlier than the activation time of the certificates of
# Ubuntu's NTS servers.  Their key exchange then fails with "not yet valid
# certificate" and, as the DHCP server is not authenticated, chronyd never
# synchronises.  Skip the certificate time checks until the first clock
# update, as chrony.conf(5) describes for computers without an RTC; the
# "makestep 1 3" of Ubuntu's chrony.conf steps the clock on that update.
nocerttimecheck 1
