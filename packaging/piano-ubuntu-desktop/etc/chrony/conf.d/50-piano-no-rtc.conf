# piano's PMIC RTC cannot be set (TD-022): every boot starts at the time
# fake-hwclock saved last (at shutdown or hourly), or at systemd's built-in
# epoch.  From such a clock the key exchange with Ubuntu's NTS pools fails
# ("not yet valid certificate"), which leaves only ntp-bootstrap.ubuntu.com,
# whose certificate set covers 1970-2100.  Skip the certificate time checks
# until the first clock update, as chrony.conf(5) describes for computers
# without an RTC, so that the pools can serve that update as well; the
# "makestep 1 3" of Ubuntu's chrony.conf steps the clock on it.
nocerttimecheck 1
# Behind a router that answers every NTP request itself no NTS source
# replies, and in Ubuntu's default "authselectmode mix" the NTS sources get
# the "require" option, so the unauthenticated DHCP server is never selected
# alone and the clock stayed wrong there.  "ignore" drops that rule
# (chrony.conf(5)): sources are selected regardless of authentication, so
# unauthenticated time is accepted when NTS is unavailable, without the
# protection NTS gives against a man in the middle.
authselectmode ignore
