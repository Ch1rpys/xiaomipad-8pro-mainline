# Suspend and resume have not been validated on Xiaomi Pad 8 Pro (piano).
# A sleep request may leave the tablet unresponsive until a forced reboot,
# so every sleep operation is refused. The GNOME idle default is changed by
# 50_piano-first-release.gschema.override. Remove both once s2idle and deep
# suspend/resume are validated on piano (project debt TD-017).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
