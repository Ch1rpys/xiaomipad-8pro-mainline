name: Native ARM64 root image

on:
  workflow_dispatch:
  push:
    branches: [ci/root-image-arm64]

permissions:
  contents: read

jobs:
  root:
    if: github.ref == 'refs/heads/ci/root-image-arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install host tools
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs squashfs-tools=1:4.6.1-1build1 squashfs-tools-ng=1.2.0-1 \
            zstd python3 python3-apt python3-debian curl p7zip-full \
            build-essential pkg-config libarchive-dev gettext libblkid-dev \
            libuuid1 uuid-dev libssl-dev openssl git util-linux cpio
          mkdir -p out/ci-arm64-inputs out/ci-arm64-tools out/ci-arm64-artifacts
          df -B1 . | tee out/ci-arm64-artifacts/disk-before.txt
          dpkg-query -W > out/ci-arm64-artifacts/host-packages.txt
      - name: Build e2fsprogs 1.47.4 with libarchive and NLS
        run: |
          git init -q out/ci-arm64-tools/e2fsprogs-src
          git -C out/ci-arm64-tools/e2fsprogs-src fetch --depth 1 \
            https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git 7ee1d505ef3b37831215f490411f346fe57e9053
          git -C out/ci-arm64-tools/e2fsprogs-src checkout -q --detach FETCH_HEAD
          mkdir out/ci-arm64-tools/e2fsprogs
          cd out/ci-arm64-tools/e2fsprogs
          ../e2fsprogs-src/configure --enable-nls --disable-fuse2fs --disable-defrag --disable-uuidd --with-libarchive
          make -j"$(nproc)"
          echo 'c998d64f9b58c2235186f8ee75ba602d1fdb2991d94695fd687ab0e8096b6727  misc/mke2fs.conf' | sha256sum -c
      # Runner label, sparse-only artifacts and cache/retention pattern follow
      # blu-sharky/debian-piano's MIT workflow; exact provenance is in NOTICE.
      - name: Restore pristine Desktop cache
        id: pristine
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/ci-arm64-cache
          key: pristine-arm64-c2afd538d66fdd77377d03f1ed2ac76a34f1c116baecc9a8170d68f833121f57-${{ hashFiles('ubuntu/desktop-layers.json', 'tools/merge-desktop-tars.py') }}
      - name: Reproduce the locked pristine SquashFS
        run: python3 tools/ci-root-image.py base
      - name: Save the verified pristine Desktop cache
        if: steps.pristine.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/ci-arm64-cache
          key: ${{ steps.pristine.outputs.cache-primary-key }}
      - name: Download locked packages and build desktop policy
        run: python3 tools/ci-root-image.py inputs
      - name: Native chroot build and root/sparse checks
        run: sudo python3 tools/ci-root-image.py build
      - name: Collect sparse image, inventories and stage table
        run: sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_STEP_SUMMARY python3 tools/ci-root-image.py artifacts
      - name: Upload sparse root and matching boot set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piano-root-arm64-${{ github.sha }}
          path: out/ci-arm64-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piano-root-arm64-logs-${{ github.sha }}
          path: |
            out/ci-arm64-build/manifest.json
            out/ci-arm64-build/verification.json
            out/ci-arm64-build/console.log
            out/ci-arm64-build/guest-profile.jsonl
            out/ci-arm64-build/mke2fs.log
            out/ci-arm64-build/e2fsck.log
            out/ci-arm64-build/guest/
            out/ci-arm64-inputs/apt/*.log
            out/ci-arm64-inputs/apt/manifest.json
            out/ci-arm64-cache/manifest.json
            out/ci-arm64-cache/ubuntu-desktop.log
            out/ci-arm64-artifacts/*-stage.json
            out/ci-arm64-artifacts/disk-before.txt
          if-no-files-found: warn
          retention-days: 7
